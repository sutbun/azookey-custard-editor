<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SF Symbols Browser</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#1f2328;background:#f6f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{display:grid;grid-template-rows:auto 1fr;height:100vh}.topbar{display:flex;gap:12px;align-items:center;padding:14px 18px;background:white;border-bottom:1px solid #d0d7de}.brand{font-weight:700;white-space:nowrap}.search{flex:1;min-width:180px;padding:10px 12px;border:1px solid #d0d7de;border-radius:9px;font-size:15px}.btn{border:1px solid #d0d7de;background:white;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:600}.btn:hover{background:#f3f4f6}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;min-height:0}.side,.detail{background:white;padding:16px;overflow:auto}.side{border-right:1px solid #d0d7de}.detail{border-left:1px solid #d0d7de}.section-title{font-size:12px;color:#656d76;text-transform:uppercase;letter-spacing:.06em;margin:4px 0 10px}.filter{display:flex;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer}.filter.active,.filter:hover{background:#f0f2f4}.main{overflow:auto;padding:16px}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;color:#656d76;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:130px;padding:12px;background:white;border:1px solid #d8dee4;border-radius:12px;cursor:pointer;overflow:hidden}.card:hover{border-color:#8c959f;box-shadow:0 2px 8px #00000012}.card.selected{outline:2px solid #0969da;outline-offset:-2px}.preview{width:48px;height:48px;display:grid;place-items:center}.preview img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{font-size:28px;font-weight:700;color:#8c959f}.name{width:100%;font-size:12px;text-align:center;word-break:break-word;line-height:1.3}.detail-preview{height:170px;display:grid;place-items:center;border:1px solid #d8dee4;border-radius:12px;background:#f6f8fa;margin-bottom:16px}.detail-preview img{max-width:120px;max-height:120px}.detail-name{font-weight:700;word-break:break-word;margin:0 0 12px}.copy-group{display:grid;gap:8px}.copy-group .btn{text-align:left}.hint{font-size:12px;line-height:1.55;color:#656d76}.empty{grid-column:1/-1;padding:48px;text-align:center;color:#656d76}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#ddf4ff;color:#0969da;font-size:11px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#24292f;color:white;padding:9px 13px;border-radius:8px;opacity:0;pointer-events:none;transition:.16s}.toast.show{opacity:1}@media(max-width:900px){.layout{grid-template-columns:1fr}.side,.detail{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">SF Symbols Browser</div>
    <input id="search" class="search" type="search" placeholder="Search symbols…  例: arrow / person / square" autofocus>
    <button id="openFolder" class="btn">SVGフォルダを開く</button>
    <input id="folderInput" type="file" accept="image/svg+xml,.svg" webkitdirectory multiple hidden>
  </header>
  <div class="layout">
    <aside class="side">
      <div class="section-title">表示</div>
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="loaded">SVGあり</button>
      <button class="filter" data-filter="seed">名前のみ</button>
      <hr style="border:0;border-top:1px solid #d8dee4;margin:14px 0">
      <div class="hint">Appleのアセットをこのリポジトリには同梱しません。手元のSVGフォルダを選ぶと、ファイル名をSymbol名としてローカル表示します。</div>
    </aside>
    <main class="main">
      <div class="status"><span id="count"></span><span id="sourceStatus" class="badge">Built-in names</span></div>
      <div id="grid" class="grid"></div>
    </main>
    <aside class="detail">
      <div class="section-title">選択中</div>
      <div id="detailPreview" class="detail-preview"><span class="hint">シンボルを選択</span></div>
      <p id="detailName" class="detail-name">—</p>
      <div class="copy-group">
        <button id="copyName" class="btn" disabled>Symbol名をコピー</button>
        <button id="copySwift" class="btn" disabled>SwiftUI形式をコピー</button>
        <button id="copyJson" class="btn" disabled>JSON形式をコピー</button>
      </div>
      <p class="hint" style="margin-top:16px">カードをダブルクリックしてもSymbol名をコピーできます。</p>
    </aside>
  </div>
</div>
<div id="toast" class="toast">Copied</div>
<script>
const seedNames = [
'arrow.left','arrow.right','arrow.up','arrow.down','arrow.clockwise','arrow.counterclockwise','arrow.up.right','arrow.down.left','chevron.left','chevron.right','chevron.up','chevron.down','xmark','checkmark','plus','minus','ellipsis','circle','circle.fill','square','square.fill','rectangle','triangle','star','star.fill','heart','heart.fill','person','person.fill','person.2','person.3','house','house.fill','folder','folder.fill','doc','doc.fill','trash','trash.fill','pencil','pencil.circle','magnifyingglass','gearshape','gearshape.fill','slider.horizontal.3','line.3.horizontal','sidebar.left','sidebar.right','square.and.arrow.up','square.and.arrow.down','doc.on.doc','clipboard','link','paperclip','bell','bell.fill','calendar','clock','timer','stopwatch','play','pause','stop','forward','backward','speaker.wave.2','speaker.slash','mic','camera','photo','video','keyboard','command','option','shift','capslock','return','delete.left','globe','wifi','battery.100','bolt','lock','lock.open','eye','eye.slash','info.circle','questionmark.circle','exclamationmark.triangle'
];
let symbols = seedNames.map(name => ({name, url:null, source:'seed'}));
let selected = null;
let currentFilter = 'all';
const $ = id => document.getElementById(id);
const grid = $('grid');
const search = $('search');
function normalized(s){return s.toLowerCase().replace(/[._-]+/g,' ')}
function filtered(){
  const q = normalized(search.value.trim());
  return symbols.filter(s => {
    if(currentFilter==='loaded' && !s.url) return false;
    if(currentFilter==='seed' && s.url) return false;
    if(!q) return true;
    const hay = normalized(s.name);
    return q.split(/\s+/).every(part => hay.includes(part));
  });
}
function render(){
  const items = filtered();
  $('count').textContent = `${items.length.toLocaleString()} symbols`;
  grid.innerHTML='';
  if(!items.length){grid.innerHTML='<div class="empty">該当するSymbolがありません。</div>';return}
  const frag=document.createDocumentFragment();
  for(const s of items){
    const el=document.createElement('button');
    el.className='card'+(selected?.name===s.name?' selected':'');
    el.type='button';
    const pv=document.createElement('div');pv.className='preview';
    if(s.url){const img=document.createElement('img');img.src=s.url;img.alt='';pv.append(img)}
    else{const p=document.createElement('span');p.className='placeholder';p.textContent='◇';pv.append(p)}
    const nm=document.createElement('div');nm.className='name';nm.textContent=s.name;
    el.append(pv,nm);
    el.addEventListener('click',()=>selectSymbol(s));
    el.addEventListener('dblclick',()=>copyText(s.name));
    frag.append(el);
  }
  grid.append(frag);
}
function selectSymbol(s){selected=s;$('detailName').textContent=s.name;const p=$('detailPreview');p.innerHTML='';
  if(s.url){const img=document.createElement('img');img.src=s.url;img.alt=s.name;p.append(img)}else{p.innerHTML='<span class="hint">SVG未読込<br>名前検索・コピーは利用可能</span>'}
  for(const id of ['copyName','copySwift','copyJson'])$(id).disabled=false;render();
}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast(`Copied: ${text}`)}catch{showToast('コピーできませんでした')}}
function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1200)}
function loadSvgFiles(files){
  for(const s of symbols) if(s.url) URL.revokeObjectURL(s.url);
  const map=new Map();
  for(const f of files){
    if(!f.name.toLowerCase().endsWith('.svg')) continue;
    const name=f.name.replace(/\.svg$/i,'');
    map.set(name,{name,url:URL.createObjectURL(f),source:'loaded'});
  }
  for(const name of seedNames) if(!map.has(name)) map.set(name,{name,url:null,source:'seed'});
  symbols=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
  $('sourceStatus').textContent=`${map.size.toLocaleString()} indexed`;
  render();
}
$('openFolder').addEventListener('click',()=>$('folderInput').click());
$('folderInput').addEventListener('change',e=>loadSvgFiles(e.target.files));
search.addEventListener('input',render);
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()}));
$('copyName').addEventListener('click',()=>selected&&copyText(selected.name));
$('copySwift').addEventListener('click',()=>selected&&copyText(`Image(systemName: "${selected.name}")`));
$('copyJson').addEventListener('click',()=>selected&&copyText(`"symbol": "${selected.name}"`));
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus()}if(e.key==='Escape'){search.value='';search.focus();render()}});
render();
</script>
</body>
</html>
