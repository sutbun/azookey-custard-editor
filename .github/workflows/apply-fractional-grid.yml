name: Apply fractional grid editor update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fractional-grid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch editor
        run: python scripts/apply_fractional_grid.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v3.6.0: official fractional grid_fit' index.html
          grep -q 'fineMoveLeftBtn' index.html
          grep -q 'min="0.1" step="0.1"' index.html
          grep -q "fineMoveLeft:{label:'キーを左へ0.1移動'" index.html
          grep -q "{action:'selectLeft',keys:'Alt+ArrowLeft'}" index.html
          grep -q "{action:'fineMoveLeft',keys:'Shift+ArrowLeft'}" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*application/json)[^>]*>(.*?)</script>',text,re.S)
          assert scripts, 'main script not found'
          Path('/tmp/editor.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'GRID_FIT_MIN_SIZE = 0.1' in text
          PY
          node --check /tmp/editor.js

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-fractional-grid.yml scripts/apply_fractional_grid.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-fractional-grid.yml scripts/apply_fractional_grid.py
          git commit -m 'feat: support fractional grid adjustments'
          git push origin HEAD:main
